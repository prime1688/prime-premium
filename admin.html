<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIME Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;background:#09060d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#15101d;border:1px solid #35234a;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{color:#c879ff;font-size:28px;font-weight:900}.muted{color:#aaa}.err{color:#ff7777}.amount{font-size:22px;font-weight:900;color:#d78cff}.pill{padding:6px 10px;border-radius:99px;background:#2b1c35;color:#dca5ff}.login{max-width:430px;margin:80px auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#100c14;border:1px solid #30203e;border-radius:14px;padding:14px}.stat small{color:#999}.stat strong{display:block;color:#d78cff;font-size:22px;margin-top:5px}.orders{max-height:55vh;overflow:auto}.order{padding:13px 0;border-bottom:1px solid #29202f}.order:last-child{border-bottom:0}.st-pending{color:#ffd166}.st-processing{color:#d09aff}.st-completed{color:#7ee787}.st-failed,.st-cancelled{color:#ff7777}button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.ok{background:#9d4edd;color:#fff}.no{background:#3a263f;color:#fff}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.stat strong{font-size:19px}}

/* PRIME PURPLE-WHITE VISUAL THEME — COLOR ONLY */
html,body{background:
  radial-gradient(circle at 15% 0%,rgba(197,138,255,.22),transparent 30%),
  radial-gradient(circle at 85% 10%,rgba(155,77,255,.16),transparent 28%),
  linear-gradient(180deg,#faf7ff 0%,#f1e8ff 52%,#fbf9ff 100%) !important;
  color:#211044 !important;
}
.card,.stat{
  background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(244,235,255,.92)) !important;
  border-color:#e1caff !important;
  color:#211044 !important;
  box-shadow:0 10px 28px rgba(111,34,217,.08) !important;
}
.title,.amount,.stat strong{color:#6f22d9 !important;}
.muted,.stat small{color:#725f8e !important;}
.pill{background:#eee0ff !important;color:#6f22d9 !important;}
button.ok{background:linear-gradient(135deg,#a957ff,#6f22d9) !important;color:#fff !important;}
button.no{background:linear-gradient(180deg,#fff,#f1e6ff) !important;color:#211044 !important;border:1px solid #e1caff !important;}
.order{border-bottom-color:#eadcff !important;}


.member-head,.member-row{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:12px;align-items:center}.member-head{padding:10px 12px;color:#806a96;font-size:11px;font-weight:900;border-bottom:1px solid #eadcff}.member-row{padding:13px 12px;border-bottom:1px solid #eadcff}.member-row:last-child{border-bottom:0}.member-row strong{color:#32154d}.member-credit{color:#6f22d9!important;font-size:18px}.members-table-wrap{margin-top:12px;border:1px solid #e1caff;border-radius:14px;overflow:auto;background:rgba(255,255,255,.55)}
@media(max-width:700px){.member-head,.member-row{grid-template-columns:1.2fr .8fr}.member-head span:last-child,.member-row span:last-child{display:none}.member-row{padding:12px 10px}.member-credit{font-size:16px}}
</style>
<style>.member-summary{margin:14px 0;padding:12px 14px;background:#100c14;border:1px solid #30203e;border-radius:12px;color:#bbb}.member-summary strong{color:#d78cff}.member-head,.member-row{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:12px;align-items:center;padding:13px 10px}.member-head{color:#aaa;font-size:13px;border-bottom:1px solid #30203e}.member-row{border-bottom:1px solid #29202f}.member-credit{color:#d78cff}@media(max-width:700px){.member-head,.member-row{grid-template-columns:1fr 1fr}.member-head span:last-child,.member-row span:last-child{grid-column:1/-1}}</style>
</head><body><div class="wrap"><div class="row"><div class="title">PRIME ADMIN</div><button class="no" onclick="location.href='./'">กลับ PRIME</button></div><div id="app"><div class="card login"><h2>กำลังตรวจสอบสิทธิ์...</h2><div class="muted">หน้านี้เข้าได้เฉพาะบัญชีแอดมิน</div></div></div></div><script>
const SUPABASE_URL="https://uxatabaoxbmgswcqrptq.supabase.co",SUPABASE_KEY="sb_publishable_WIFz-7unS6IQFspqOSoj_Q_BST2Hr4o";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function session(){const r=await Promise.race([sb.auth.getSession(),new Promise((_,j)=>setTimeout(()=>j(new Error("หมดเวลาตรวจสอบเซสชัน")),8000))]);return r?.data?.session||null}
function loginBox(msg){app.innerHTML='<div class="card login"><h2>เข้าสู่ระบบแอดมิน</h2><p class="err">'+esc(msg)+'</p><p class="muted">กลับหน้า PRIME แล้วเข้าสู่ระบบด้วยบัญชีแอดมิน จากนั้นเปิดหน้า Admin อีกครั้ง</p><button class="ok" onclick="location.href='./'">กลับ PRIME</button></div>'}
async function init(){try{const s=await session();if(!s)return loginBox("ไม่พบเซสชัน กรุณาเข้าสู่ระบบก่อน");const r=await sb.rpc("is_prime_admin");if(r.error)return loginBox("ตรวจสอบสิทธิ์ไม่สำเร็จ: "+r.error.message);if(!r.data)return loginBox("บัญชีนี้ไม่มีสิทธิ์แอดมิน");render();await refreshAll()}catch(e){loginBox(e.message||"เกิดข้อผิดพลาด")}}
function render(){app.innerHTML='<div class="card"><div class="row"><div><h2>Dashboard</h2><div class="muted">ข้อมูลจริงจาก PRIME · อัปเดตเมื่อกดรีเฟรช</div></div><button class="no" onclick="refreshAll()">รีเฟรชทั้งหมด</button></div><div id="stats" class="stats" style="margin-top:15px"></div></div><div class="card"><div class="row"><div><h2>สมาชิก</h2><div class="muted">ดูเบอร์โทรศัพท์และยอดเงินคงเหลือของสมาชิก</div></div><button class="no" onclick="loadMembers()">รีเฟรชสมาชิก</button></div><div id="members" class="members-table-wrap"></div></div><div class="card"><div class="row"><div><h2>ออเดอร์ล่าสุด</h2><div class="muted">ติดตามออเดอร์ของลูกค้า</div></div></div><div id="orders" class="orders"></div></div><div class="card"><div class="row"><div><h2>รายการเติมเงินรออนุมัติ</h2><div class="muted">ตรวจสอบยอดโอนก่อนเพิ่มเครดิต</div></div></div><div id="deposits"></div></div>'}
async function refreshAll(){await Promise.all([loadStats(),loadMembers(),loadOrders(),loadDeposits()])}
async function loadStats(){const el=document.getElementById("stats");if(!el)return;const r=await sb.rpc("admin_dashboard_stats");if(r.error){el.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';return}const x=r.data||{};el.innerHTML='<div class="stat"><small>ยอดขายวันนี้</small><strong>฿'+Number(x.today_sales||0).toFixed(2)+'</strong></div><div class="stat"><small>ออเดอร์วันนี้</small><strong>'+Number(x.today_orders||0)+'</strong></div><div class="stat"><small>สมาชิกทั้งหมด</small><strong>'+Number(x.members||0).toLocaleString("th-TH")+'</strong></div><div class="stat"><small>เติมเงินวันนี้</small><strong>฿'+Number(x.today_deposits||0).toFixed(2)+'</strong></div><div class="stat"><small>รอดำเนินการ</small><strong>'+Number(x.pending_orders||0)+'</strong></div><div class="stat"><small>กำลังดำเนินการ</small><strong>'+Number(x.processing_orders||0)+'</strong></div><div class="stat"><small>สำเร็จแล้ว</small><strong>'+Number(x.completed_orders||0)+'</strong></div>'}
async function loadMembers(){
  const el=document.getElementById("members"); if(!el)return;
  el.innerHTML='<div class="muted">กำลังโหลดข้อมูลสมาชิก...</div>';
  try{
    const r=await sb.rpc("admin_members");
    if(r.error){el.innerHTML='<div class="err">โหลดสมาชิกไม่สำเร็จ: '+esc(r.error.message)+'</div>';return}
    const rows=Array.isArray(r.data)?r.data:[];
    if(!rows.length){el.innerHTML='<div class="muted">ยังไม่มีสมาชิกในระบบ</div>';return}
    el.innerHTML='<div class="member-summary">สมาชิกทั้งหมด <strong>'+rows.length.toLocaleString("th-TH")+'</strong> คน</div>'+
      '<div class="member-head"><span>เบอร์โทรศัพท์</span><span>ยอดเงินคงเหลือ</span><span>สมัครเมื่อ</span></div>'+
      rows.map(m=>'<div class="member-row"><strong>'+esc(m.phone||"-")+'</strong><strong class="member-credit">฿'+Number(m.credit||0).toFixed(2)+'</strong><span class="muted">'+(m.created_at?new Date(m.created_at).toLocaleString("th-TH"):"-")+'</span></div>').join("");
  }catch(e){el.innerHTML='<div class="err">เกิดข้อผิดพลาด: '+esc(e.message||String(e))+'</div>'}
}
async function loadOrders(){const el=document.getElementById("orders");const r=await sb.rpc("admin_orders");if(r.error){el.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){el.innerHTML='<div class="muted">ยังไม่มีออเดอร์</div>';return}el.innerHTML=rows.map(o=>'<div class="order"><div class="row"><strong>#'+esc(String(o.id).slice(0,8).toUpperCase())+' · '+esc(o.phone||"-")+'</strong><strong>฿'+Number(o.total_price||0).toFixed(2)+'</strong></div><div>'+esc(o.platform||"")+' · '+esc(o.service_name||"")+' · '+Number(o.quantity||0).toLocaleString("th-TH")+' <span class="st-'+esc(o.status)+'">'+esc(o.status)+'</span></div><div class="muted">'+new Date(o.created_at).toLocaleString("th-TH")+'</div><div class="muted" style="word-break:break-all">'+esc(o.target_url||"")+'</div></div>').join("")}
async function loadDeposits(){const el=document.getElementById("deposits");const r=await sb.rpc("admin_pending_deposits");if(r.error){el.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){el.innerHTML='<div class="muted">ไม่มีรายการรออนุมัติ</div>';return}el.innerHTML=rows.map(x=>'<div class="card"><div class="row"><div><div class="pill">'+esc(x.phone||x.user_id)+'</div><p class="amount">฿'+Number(x.amount).toFixed(2)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString("th-TH")+'</div><div class="muted">'+esc(x.description||"")+'</div></div><div class="row"><button class="ok" onclick="approve(\''+esc(x.id)+'\')">✓ อนุมัติ</button><button class="no" onclick="reject(\''+esc(x.id)+'\')">ปฏิเสธ</button></div></div></div>').join("")}
async function approve(id){if(!confirm("ยืนยันอนุมัติรายการนี้? เครดิตจะถูกเพิ่มให้สมาชิกทันที"))return;const r=await sb.rpc("admin_approve_deposit",{p_transaction_id:id});if(r.error)alert(r.error.message);else if(!r.data?.success)alert(r.data?.message||"ดำเนินการไม่สำเร็จ");else{alert("อนุมัติแล้ว เครดิตใหม่ ฿"+Number(r.data.credit).toFixed(2));await refreshAll()}}
async function reject(id){if(!confirm("ยืนยันปฏิเสธรายการนี้?"))return;const r=await sb.rpc("admin_reject_deposit",{p_transaction_id:id});if(r.error)alert(r.error.message);else{alert("ปฏิเสธรายการแล้ว");await refreshAll()}}
init();
</script></body></html>

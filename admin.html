<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIME Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;background:#09060d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#15101d;border:1px solid #35234a;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{color:#c879ff;font-size:28px;font-weight:900}button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.ok{background:#9d4edd;color:#fff}.no{background:#3a263f;color:#fff}.muted{color:#aaa}.amount{font-size:22px;font-weight:900;color:#d78cff}.pill{padding:6px 10px;border-radius:99px;background:#2b1c35;color:#dca5ff}.login{max-width:430px;margin:80px auto}.err{color:#ff7777}
</style></head><body><div class="wrap"><div class="title">PRIME ADMIN</div><div id="app"><div class="card login"><h2>กำลังตรวจสอบสิทธิ์...</h2><div class="muted">หน้านี้เข้าได้เฉพาะบัญชีแอดมิน</div></div></div></div><script>
const SUPABASE_URL="https://uxatabaoxbmgswcqrptq.supabase.co",SUPABASE_KEY="sb_publishable_WIFz-7unS6IQFspqOSoj_Q_BST2Hr4o";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById("app");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){return loginBox("กรุณาเข้าสู่ระบบ PRIME ก่อน");}const {data:ok,error}=await sb.rpc("is_prime_admin");if(error||!ok){return loginBox("บัญชีนี้ไม่มีสิทธิ์แอดมิน");}render();load();}
function loginBox(msg){app.innerHTML='<div class="card login"><h2>เข้าสู่ระบบแอดมิน</h2><p class="err">'+esc(msg)+'</p><p class="muted">เปิดหน้า PRIME หลักและเข้าสู่ระบบด้วยบัญชีแอดมิน จากนั้นกลับมาหน้านี้</p><button class="ok" onclick="location.href='./'">กลับ PRIME</button></div>'}
function render(){app.innerHTML='<div class="card"><div class="row"><div><h2>รายการเติมเงินรออนุมัติ</h2><div class="muted">ตรวจสอบยอดโอนก่อนกดอนุมัติ</div></div><button class="no" onclick="load()">รีเฟรช</button></div></div><div id="list"></div>'}
async function load(){const {data,error}=await sb.rpc("admin_pending_deposits");const list=document.getElementById("list");if(error){list.innerHTML='<div class="card err">'+esc(error.message)+'</div>';return}if(!data?.length){list.innerHTML='<div class="card muted">ไม่มีรายการรออนุมัติ</div>';return}list.innerHTML=data.map(x=>'<div class="card"><div class="row"><div><div class="pill">'+esc(x.phone||x.user_id)+'</div><p class="amount">฿'+Number(x.amount).toFixed(2)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString("th-TH")+'</div><div class="muted">'+esc(x.description||"")+'</div></div><div class="row"><button class="ok" onclick="approve(\''+x.id+'\')">✓ อนุมัติ</button><button class="no" onclick="reject(\''+x.id+'\')">ปฏิเสธ</button></div></div></div>').join("")}
async function approve(id){if(!confirm("ยืนยันอนุมัติรายการนี้? เครดิตจะถูกเพิ่มให้สมาชิกทันที"))return;const {data,error}=await sb.rpc("admin_approve_deposit",{p_transaction_id:id});if(error)alert(error.message);else if(!data?.success)alert(data?.message||"ดำเนินการไม่สำเร็จ");else{alert("อนุมัติแล้ว เครดิตใหม่ ฿"+Number(data.credit).toFixed(2));load()}}
async function reject(id){if(!confirm("ยืนยันปฏิเสธรายการนี้?"))return;const {data,error}=await sb.rpc("admin_reject_deposit",{p_transaction_id:id});if(error)alert(error.message);else{alert("ปฏิเสธรายการแล้ว");load()}}
init();
</script></body></html>
